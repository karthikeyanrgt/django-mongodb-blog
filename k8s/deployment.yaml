apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-deployment
  labels:
    app: django
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
      - name: django-container
        image: cicdtestacr.azurecr.io/django-app:latest
        ports:
        - containerPort: 8000
        env:
          - name: PYTHONDONTWRITEBYTECODE
            value: "1"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: MONGODB_HOST
            value: "mongo-service"
          - name: MONGODB_PORT
            value: "27017"
          - name: MONGODB_NAME
            value: "blogdb"
        resources:
          requests:
            cpu: "80m"
            memory: "100Mi"
          limits:
            cpu: "150m"
            memory: "200Mi"